# /etc/systemd/system/llama-router.service.d/gemm-tune.conf
# The rocBLAS autotune keeps its choices here, so a shape is timed once, not after every load.
# GGML_CUDA_FA_VEC_GQA=1: no GQA head folding in the vec attention kernel (it spills registers on gfx900).
[Service]
StateDirectory=llama-router
Environment=GGML_HIP_GEMM_TUNE_FILE=/var/lib/llama-router/hip-gemm-tune.txt
Environment=GGML_CUDA_FA_VEC_GQA=1
