; /etc/llama/models.ini (llama-server --models-preset). Two MI25s: ROCm0 and ROCm1.

[*]
n-gpu-layers = 99
jinja = true
reasoning-format = deepseek
flash-attn = auto
cache-idle-slots = false

; Qwen3.8 27B Q6 on both cards, tensor split, 262k context, MTP drafts, thinking off by default
[qwen38-27b]
model = /path/to/qwen3.8-27b-q6.gguf
device = ROCm0,ROCm1
split-mode = tensor
tensor-split = 0.5,0.5
threads = 4
c = 262144
parallel = 1
ubatch-size = 1024
cache-type-k = q8_0
cache-type-v = q4_0
spec-type = draft-mtp
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
n-predict = 32768
chat-template-kwargs = {"enable_thinking":false}
